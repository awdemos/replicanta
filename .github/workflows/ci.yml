name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the dagger pipeline (lint + test)
        uses: dagger/dagger-for-github@v8
        with:
          version: "0.21.8"
          verb: call
          args: ci --source=.
