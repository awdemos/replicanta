[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replicanta"
version = "0.1.0"
description = "A self-improving digital organism whose mind is a probabilistic Scallop program"
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "lupa>=2.0",
    "numpy",
    "piper-tts>=1.2",
    "soundcard>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
listen = ["faster-whisper>=1.0"]

[project.scripts]
replicanta = "tui:main"

[tool.setuptools]
py-modules = [
    "activity",
    "arena",
    "extensions",
    "fileutil",
    "hooks",
    "learning",
    "listen",
    "narration",
    "nursery",
    "organism",
    "probe",
    "sentiment",
    "skills",
    "speech",
    "tui",
    "tui_commands",
    "tui_views",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
