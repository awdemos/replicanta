[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replicanta"
version = "0.2.0"
description = "A neurosymbolic organism implementation coupling Scallop with an LLM backend"
readme = "readme.md"
requires-python = ">=3.14"
license = { text = "MIT" }
# scallopy (core import in organism.py) is not on PyPI; install the pinned
# wheel from wheels/ alongside this package (see readme.md).
dependencies = [
    "textual>=1.0",
    "numpy",      # core: listen.py/speech.py arrays; imported by tests
    "lupa>=2.0",  # core: hooks.py Lua runtime; exercised by the test suite
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
voice = ["piper-tts>=1.2", "soundcard>=0.4"]
listen = ["faster-whisper>=1.0", "soundcard>=0.4"]
vision = ["opencv-python-headless>=4.8"]

[project.scripts]
replicanta = "tui:main"

[tool.setuptools]
py-modules = [
    "activity",
    "arena",
    "camera",
    "extensions",
    "fileutil",
    "goals",
    "groupchat",
    "hooks",
    "learning",
    "listen",
    "llmclient",
    "mud",
    "narration",
    "nursery",
    "organism",
    "probe",
    "sentiment",
    "skills",
    "speech",
    "tui",
    "tui_commands",
    "tui_views",
    "voice",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
